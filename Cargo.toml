[workspace]
resolver = "3"          # edition 2024 default; MSRV-aware: incompatible-rust-versions = "fallback"
# Explicit, not a glob: adding a crate means editing the file that holds the lints. Every new member needs
# `[lints] workspace = true`, a deny.toml layering entry, and (if core-like) its own clippy.toml.
members = [
  "crates/minos-core",
  "crates/minos-store",
  "crates/minos-sandbox",
  "crates/minos-source",
  "crates/minos-backend-krun",
  "crates/minos-propose",
  "crates/minos-runner",
  "crates/minos-loop",
  "crates/minos-vmm",
  "crates/minos-guest",
  "crates/minos-cli",
]
# The sample projects build standalone inside the VM, where the snapshot has no parent workspace to inherit
# `[lints] workspace = true` from (08-RESEARCH E8). They carry their own literal lint tables and are checked with
# their own `--manifest-path` gate commands.
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"  # patch versions are accepted
license = "MIT"
publish = false          # v1 publishes nothing; also makes clippy::cargo_common_metadata skip the crate

[profile.release]
# Every binary parses hostile input (sandbox output, diffs, job specs). Integer overflow in a size cap,
# a length-prefixed hash, or pico-dollar accumulation must panic, not wrap, without relying on each call site.
# panic = "abort" cannot be set for minos-guest alone: Cargo rejects `panic` in a [profile.*.package.*]
# override (02-SPIKE-EVIDENCE.md P-PANIC). Unwinding stays. If the guest's PID 1 panics, the kernel panics and
# the VM powers off without sending a status frame, which the host classifies as Crashed.
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Groups. priority -1 so the single-lint entries below (priority 0) override them.
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
cargo       = { level = "warn", priority = -1 }
# Locked by CLAUDE.md at forbid (UAT test 1): no allow at any position and no #[expect] can lower them
unwrap_used = "forbid"
expect_used = "forbid"
indexing_slicing = "forbid"
# D-02 / GATE-05: outer #[allow] is denied and every allow/expect needs a reason. The three forbid
# lints above cannot be suppressed at all. For every other lint an inner #![allow(..., reason)]
# still passes clippy (01-GATE-EVIDENCE.md R-03); the per-phase C-02 grep catches it, not the gate.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# rules/lint-unsafe-doc.md (moot while unsafe_code is forbid, but kept as defense in depth)
undocumented_unsafe_blocks = "deny"
# Carve-outs. Cargo rejects a `reason` key, so reasons are comments.
# pedantic, rules/lint-pedantic-selective.md: an arbitrary line-count threshold says nothing about correctness
too_many_lines = "allow"
# pedantic, rules/lint-pedantic-selective.md: domain pairs such as base/baseline and exp/expr are intentional
similar_names = "allow"
# pedantic, rules/lint-pedantic-selective.md: config and capability structs legitimately carry several flags
struct_excessive_bools = "allow"
# cargo: msb_krun, proptest, and backhand pull duplicate versions we cannot unify; cargo-deny multiple-versions = "warn" reports them
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"   # enforced by `cargo doc --workspace --no-deps`, the fifth gate command; clippy and test ignore this table

[workspace.dependencies]
minos-core         = { path = "crates/minos-core", version = "=0.1.0" }
minos-store        = { path = "crates/minos-store", version = "=0.1.0" }
minos-sandbox      = { path = "crates/minos-sandbox", version = "=0.1.0" }
minos-source       = { path = "crates/minos-source", version = "=0.1.0" }
minos-backend-krun = { path = "crates/minos-backend-krun", version = "=0.1.0" }
minos-propose      = { path = "crates/minos-propose", version = "=0.1.0" }
minos-runner       = { path = "crates/minos-runner", version = "=0.1.0" }
minos-loop         = { path = "crates/minos-loop", version = "=0.1.0" }
serde        = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: with default features about 10% of typical metric values change bits on a JSON round trip
# (03-RESEARCH Pitfall 1: 206,407 of 2,000,000), which would break the ledger fold and the golden files.
# The feature adds no dependency.
serde_json   = { version = "=1.0.151", features = ["float_roundtrip"] }
toml         = "=1.1.8"
thiserror    = "=2.0.21"
anyhow       = "=1.0.104"
# clap: builder API only (01-UAT.md test 6, option A). clap_derive 4.6.7 puts #[allow(clippy::restriction)]
# on generated impls, which is E0453 under the three forbid lints (01-GATE-EVIDENCE.md F-01), so the derive
# feature stays off. Turning it back on is a user decision, never a lint change.
clap         = { version = "=4.6.7" }
sha2         = "=0.11.0"
base16ct     = { version = "=1.0.0", features = ["alloc"] }
diffy        = { version = "=0.5.2", default-features = false, features = ["std"] }
tar          = { version = "=0.4.46", default-features = false }
ignore       = "=0.4.33"
regex        = "=1.13.1"
rand_chacha  = { version = "=0.10.0", default-features = false }
rand_core    = "=0.10.1"
# minos-vmm's capped stderr logger (DIAG-01); already in Cargo.lock through msb_krun.
log = "=0.4.34"
rustix       = { version = "=1.1.5", features = ["event", "fs", "mount", "process", "system"] }
vsock        = "=0.5.4"
# Bumping this pin requires re-running by hand the ignored VM test `exit_env` in
# crates/minos-backend-krun/tests/exit.rs (plan 05-19), which asserts the guest's exact /proc/cmdline tokens
# (02-SPIKE-EVIDENCE.md S01-CMDLINE): minos-vmm smuggles `root=/dev/vda` through `KernelBuilder::init_path`,
# which only works while msb_krun formats the init path unquoted and after the user cmdline
# (crates/minos-vmm/src/launch.rs).
msb_krun     = { version = "=0.1.41", default-features = false, features = ["blk"] }
backhand     = { version = "=0.25.5", default-features = false, features = ["gzip"] }
tempfile     = "=3.27.0"
tracing      = "=0.1.44"
tracing-subscriber = "=0.3.23"
proptest     = "=1.11.0"
insta        = { version = "=1.49.0", features = ["json", "toml"] }
trybuild     = "=1.0.122"
