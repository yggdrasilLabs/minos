# cargo-deny 0.20.2 policy. `cargo deny check` is the fourth gate command (CLAUDE.md Commands).
# Every entry here is reviewed policy. Never add an exception, ignore, or allowlist entry just to get green.

[graph]
# D-09: the guest graph is checked now even though Phase 1 builds only for the host.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl"]
all-features = false   # never true: it would pull backhand zstd/xz (C) into the checked graph

[advisories]
# RustSec vulnerabilities fail by default. The DB is fetched over the network;
# `cargo deny --offline check` uses the cached copy. An advisory hit is a stop-and-report. The only way past
# one is an `ignore` entry that names the advisory and carries a reviewed reason; cargo-deny warns when an
# entry stops matching, so it cannot go stale silently. Never narrow the scope instead.
unmaintained = "all"      # default scope; the transitive VMM path is exactly where this matters
yanked = "deny"
ignore = [
  # Reviewed 2026-10-09. bincode 2.0.1 is pulled only by msb_krun_devices and msb_krun_vmm (the pinned
  # VMM). No alternative without replacing msb_krun. Re-review on every msb_krun bump. cargo-deny warns
  # when this entry stops matching, so it cannot go stale silently.
  { id = "RUSTSEC-2025-0141", reason = "bincode 2 via msb_krun =0.1.41; VMM is replaced, not patched" },
]

[licenses]
# Exactly what the v1 graph needs (each entry was removed in turn to confirm it is required):
#   BSD-3-Clause: msb_krun_* sub-crates ("Apache-2.0 AND BSD-3-Clause"), vm-fdt, virtio-bindings
#   BSL-1.0:      xxhash-rust (via backhand)
#   ISC:          libloading (via msb_krun)
#   Unicode-3.0:  unicode-ident
#   Zlib:         foldhash (via diffy -> hashbrown), zlib-rs (via flate2)
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"   # duplicates stay visible while clippy's multiple_crate_versions is carved out
wildcards = "deny"           # internal path dependencies carry version = "=0.1.0", so no exception is needed
deny = [
  # No C in our tree (CLAUDE.md). `cc` must get a wrapper when the rustls provider arrives (AWS milestone).
  { crate = "openssl-sys", reason = "no OpenSSL" },
  { crate = "openssl", reason = "no OpenSSL" },
  { crate = "native-tls", reason = "no OpenSSL" },
  { crate = "git2", reason = "no libgit2" },
  { crate = "libgit2-sys", reason = "no libgit2" },
  { crate = "gix", reason = "no git in the trusted path" },
  { crate = "zstd-sys", reason = "C; backhand uses gzip only" },
  { crate = "liblzma-sys", reason = "C; backhand uses gzip only" },
  { crate = "cc", reason = "no C compiled in our tree" },
  # `cc` catches crates that compile C. These catch crates that link or bind an installed C library
  # without compiling it, which `cc` never sees. None is in either aarch64 graph today.
  { crate = "pkg-config", reason = "links system C libraries without compiling; no C in our tree" },
  { crate = "vcpkg",      reason = "links system C libraries without compiling; no C in our tree" },
  { crate = "cmake",      reason = "builds C/C++ in our tree" },
  { crate = "bindgen",    reason = "generates FFI to C in our tree" },
  { crate = "bzip2-sys",  reason = "C; only reachable on x86_64 via msb_krun_vmm" },
  { crate = "libz-sys",   reason = "C; flate2 must stay on miniz_oxide or zlib-rs" },
  { crate = "aws-lc-sys", reason = "C; the rustls provider is a reviewed exception, not a default" },
  { crate = "ring",       reason = "C and asm; the rustls provider is a reviewed exception, not a default" },
  # Who may link what
  { crate = "anyhow", wrappers = ["minos-cli"], reason = "anyhow only at the CLI main (rules/err-anyhow-app.md)" },
  { crate = "msb_krun", wrappers = ["minos-vmm"], reason = "only minos-vmm links the VMM (KRUN-01)" },
  # Crate layering (GATE-04, D-03). `wrappers` lists the crates allowed to depend on the banned crate DIRECTLY.
  # It does not follow transitive paths (verified in research: with only minos-sandbox banned,
  # minos-loop -> minos-runner -> minos-sandbox passed), so every internal library crate needs its own entry.
  # The binaries (minos-vmm, minos-guest, minos-cli) need none: nothing depends on them.
  # Dev-dependency edges are in the checked graph too.
  { crate = "minos-core", wrappers = ["minos-store", "minos-sandbox", "minos-backend-krun", "minos-guest", "minos-propose", "minos-runner", "minos-loop", "minos-cli"], reason = "core depends on no internal crate" },
  { crate = "minos-store", wrappers = ["minos-runner", "minos-loop", "minos-cli"], reason = "layering" },
  { crate = "minos-sandbox", wrappers = ["minos-backend-krun", "minos-runner", "minos-cli"], reason = "core and loop never see sandbox types" },
  { crate = "minos-backend-krun", wrappers = ["minos-cli"], reason = "only the CLI picks a concrete backend" },
  { crate = "minos-propose", wrappers = ["minos-loop", "minos-cli"], reason = "layering" },
  { crate = "minos-runner", wrappers = ["minos-cli"], reason = "loop reaches the runner only through its JobRunner trait" },
  { crate = "minos-loop", wrappers = ["minos-cli"], reason = "layering" },
]

[bans.workspace-dependencies]
duplicates = "deny"               # a member may not redeclare a workspace dep without `workspace = true`
include-path-dependencies = true
unused = "deny"                   # every [workspace.dependencies] entry must be used

[bans.build]
# Every crate in the aarch64-apple-darwin + aarch64-unknown-linux-musl graph that has a build.rs.
# A new build-script-not-allowed error is a review point: read the crate's build.rs before adding it here.
# Never add an entry automatically.
allow-build-scripts = [
  { crate = "anyhow" }, { crate = "crc32fast" }, { crate = "crossbeam-deque" }, { crate = "crossbeam-epoch" },
  { crate = "crossbeam-utils" }, { crate = "getrandom" }, { crate = "kvm-ioctls" },      # kvm-ioctls: linux-musl only (msb_krun)
  { crate = "libc" }, { crate = "memoffset" }, { crate = "msb-imago" }, { crate = "msb_krun_hvf" },  # msb_krun_hvf: only links Hypervisor.framework
  { crate = "nix" }, { crate = "num-traits" }, { crate = "proc-macro2" }, { crate = "quote" }, { crate = "radium" },
  { crate = "rustix" }, { crate = "rustversion" }, { crate = "serde" }, { crate = "serde_core" }, { crate = "serde_json" },
  { crate = "target-tuple" }, { crate = "thiserror" }, { crate = "zerocopy" }, { crate = "zmij" },
]
executables = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"   # GATE-03: a git dependency must be pinned by rev
allow-git = []              # the AWS milestone adds aws-durable-execution-sdk-rust
